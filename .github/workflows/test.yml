name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node: ['22', '24']
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # 没有运行时依赖：@deepseek-ai/dsh-llm 只是 api 模式的可选 peer，
      # 所以这里故意不跑 npm install —— 测试必须在裸检出上就绿。
      - name: test
        run: npm test

      - name: pack
        run: npm pack --dry-run
